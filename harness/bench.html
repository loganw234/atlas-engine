<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>atlas-engine bench</title>
<style>body{margin:0;background:#000}#gl{width:1600px;height:1600px;display:block}</style>
</head>
<body>
<canvas id="gl"></canvas>
<!-- the atlas core, from the canonical checkout beside this repo -->
<script src="../../PrettyCloud/atlas/js/core/registry.js"></script>
<script src="../../PrettyCloud/atlas/js/core/glsl-lib.js"></script>
<!-- 0: critical, 1: critical_pos, 2: hopf, 3: hopf_pos -->
<script src="../../PrettyCloud/atlas/js/plates/58-critical.js"></script>
<script src="../build/critical_pos.plate.js"></script>
<script src="../../PrettyCloud/atlas/js/plates/01-hopf.js"></script>
<script src="../build/hopf_pos.plate.js"></script>
<script src="../../PrettyCloud/atlas/js/core/renderer.js"></script>
<script>
"use strict";
// A measurement bench, not a toy: fixed orthographic-style view of the
// z = 0 plane (world [-EXT, EXT] to NDC), no camera, no governor, no
// UI. gamma 1 and hue 0 so the tonemap can be inverted exactly.
const EXT = 1.6;
const canvas = document.getElementById("gl");
window.__ready = Atlas.Renderer.init(canvas, () => { window.__lost = true; });
const vp = new Float32Array([1/EXT,0,0,0, 0,1/EXT,0,0, 0,0,-0.01,0, 0,0,0,1]);

window.__still = function (idx, levers, frames, N, intensityScale, simT) {
  return new Promise(res => {
    // the async link is polled INSIDE render(), so render every frame
    // and let drew tell us when the program has arrived; waiting on
    // prepare() before rendering is a deadlock on this bench
    let failed = false;
    Atlas.Renderer.prepare([idx], ok => { if (!ok) failed = true; });
    const PA = new Float32Array(8);
    (levers || []).forEach((v, i) => PA[i] = v);
    const { w, h } = Atlas.Renderer.size();
    // total accumulated energy ~ frames * intensity * N / pixels;
    // keep the peak modest and invert the curve on the way out
    const intensity = intensityScale * (w * h) / (N * frames);
    const gain = Atlas.plates[idx].gain;
    let f = 0, spins = 0;
    function step() {
      if (failed) { res({ ok: false, why: "link failed" }); return; }
      const drew = Atlas.Renderer.render({
        vp, simT: simT || 0, morph: 0, modeA: idx, modeB: idx,
        N, ptSize: 1.0, intensity,
        gainA: gain, gainB: gain,
        PA, PB: PA,
        persist: f === 0 ? 0 : 1.0,     // frame zero clears the sheet
        exposure: 1.0, gamma: 1.0, hue: 0, sat: 1,
      });
      if (drew) f++;
      spins++;
      if (f >= frames) { res({ ok: true, w, h, frames: f }); return; }
      if (spins > 6000) { res({ ok: false, why: "never drew" }); return; }
      requestAnimationFrame(step);
    }
    step();
  });
};

// sample LINEARIZED luminance at world points on the z=0 plane.
// gamma 1 and hue 0 make the tonemap invertible per pixel:
//   h = -ln(1 - (c/255 - base*vig) / vig),  vig from the pixel.
// Linearization happens per pixel BEFORE the window average - the
// curve is convex, so averaging first would bias every window that
// holds a gradient. Pixels near saturation are flagged instead of
// trusted: satFrac reports how much of the window had clipped.
window.__sample = function (pts, radius) {
  const w = canvas.width, h = canvas.height;
  const c2 = document.createElement("canvas");
  c2.width = w; c2.height = h;
  const ctx = c2.getContext("2d");
  ctx.drawImage(canvas, 0, 0);
  const img = ctx.getImageData(0, 0, w, h).data;
  const base = [0.012, 0.013, 0.026];
  const out = [];
  const R = Math.max(0, radius | 0);
  for (const [x, y] of pts) {
    const px = Math.round((x / EXT * 0.5 + 0.5) * w);
    const py = Math.round((1 - (y / EXT * 0.5 + 0.5)) * h);
    let lum = 0, n = 0, sat = 0;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const ix = px + dx, iy = py + dy;
      if (ix < 0 || iy < 0 || ix >= w || iy >= h) continue;
      const o = (iy * w + ix) * 4;
      const u = ix / w - 0.5, v = iy / h - 0.5;
      const vig = 1 - 0.55 * (u * u + v * v);
      let l = 0, clipped = false;
      for (let c = 0; c < 3; c++) {
        const cv = img[o + c];
        if (cv >= 252) clipped = true;
        const xx = Math.min(0.999, Math.max(0, (cv / 255 - base[c] * vig) / vig));
        l += [0.299, 0.587, 0.114][c] * (-Math.log(1 - xx));
      }
      lum += l; n++;
      if (clipped) sat++;
    }
    out.push(n ? [px, py, lum / n, sat / n] : [px, py, -1, 1]);
  }
  return { w, h, out };
};
</script>
</body>
</html>
